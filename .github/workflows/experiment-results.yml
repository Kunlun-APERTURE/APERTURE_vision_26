name: 实验结果
on:
  workflow_dispatch:
    inputs:
      request_id:
        description: 实验请求编号
        required: true
        type: string
      text:
        description: 成绩文本
        required: true
        type: string
      logs:
        description: 实验日志
        required: true
        type: string
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - name: 写入成绩与文本日志
        env:
          SCORE_TEXT: ${{ inputs.text }}
          LOG_TEXT: ${{ inputs.logs }}
        run: |
          python3 - <<'PY'
          import os,pathlib
          pathlib.Path('scores.md').write_text(os.environ['SCORE_TEXT'])
          pathlib.Path('experiment.log').write_text(os.environ['LOG_TEXT'])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: experiment-result-${{ inputs.request_id }}
          path: |
            scores.md
            experiment.log
          retention-days: 30
