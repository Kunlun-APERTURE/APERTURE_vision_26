name: Development
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  development-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install coverage==7.17.0
      - run: python3 tools/test-development.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: development-coverage
          path: .coverage-reports/
