name: Experiment request
on:
  pull_request_review:
    types: [submitted, dismissed]
permissions:
  contents: read
jobs:
  request:
    if: github.event.review.state == 'approved'
    runs-on: ubuntu-24.04
    steps:
      # No candidate checkout or code execution in this event handler.
      - uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const r = context.payload.review, p = context.payload.pull_request;
            const permission = await github.rest.repos.getCollaboratorPermissionLevel({...context.repo, username:r.user.login});
            if (!['write','maintain','admin'].includes(permission.data.permission) || r.user.login===p.user.login || r.commit_id!==p.head.sha) core.setFailed('Current independent reviewer approval required');
            else fs.writeFileSync('request.json', JSON.stringify({pr:p.number, head:p.head.sha, base:p.base.sha, review_id:r.id, body:p.body}));
      - uses: actions/upload-artifact@v4
        with:
          name: experiment-request
          path: request.json
          retention-days: 7
