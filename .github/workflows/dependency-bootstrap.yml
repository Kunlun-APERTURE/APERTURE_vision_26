name: 首批依赖镜像迁移
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: dependency-bootstrap
  cancel-in-progress: false
jobs:
  bootstrap:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: write
      packages: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: 检出迁移工具
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: 安装镜像复制工具
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends skopeo
      - name: 下载并校验首批离线包
        run: python3 tools/dependency_registry.py bootstrap --manifest release/dependencies-bootstrap.json --output exports/images.tar
      - name: 登录组织镜像仓库
        run: printf '%s' "$GH_TOKEN" | skopeo login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      - name: 迁移已验收镜像
        run: python3 tools/dependency_registry.py publish --archive exports/images.tar --tag 26-11-01 --output exports/dependencies.json
      - name: 保存首批镜像清单
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-bootstrap-${{ github.run_id }}
          path: exports/dependencies.json
          if-no-files-found: ignore
          retention-days: 30
      - name: 验证匿名下载
        run: python3 tools/dependency_registry.py verify-public --manifest exports/dependencies.json --download
      - name: 附加首批镜像清单
        run: python3 tools/dependency_registry.py attach --manifest exports/dependencies.json
      - name: 退出镜像仓库
        if: always()
        run: skopeo logout ghcr.io || true
